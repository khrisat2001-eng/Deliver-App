# Tests only. The site itself is published by GitHub Pages straight from the repo root
# (Settings → Pages → Deploy from a branch), so no deploy job is needed here.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - name: Install
        run: npm ci
        working-directory: packages/core
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/core
      - name: Unit tests
        run: npm test
        working-directory: packages/core
      - name: Compiled core in assets/js/core is up to date
        run: |
          npm run build:site
          git diff --exit-code -- ../../assets/js/core
        working-directory: packages/core
      - name: Translations
        run: node scripts/check-i18n.mjs

